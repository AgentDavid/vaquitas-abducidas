    drawText(pad(shownHi), W - 4, 3, '#7fb2ff', 1, 'right');
  } else {
    drawText('PUNTOS', 4, 3, '#7fb2ff');
    drawText(pad(score), 46, 3, PAL.w);
    drawText(pad(shownHi), W - 4, 3, PAL.w, 1, 'right');
    drawText('RECORD', W - 4 - 42, 3, '#7fb2ff', 1, 'right');
  }

  for (let i = 0; i < Math.min(lives, COMPACT ? 3 : 4); i++) drawSprite(SPR.truck, 4 + i * (COMPACT ? 21 : 23), H - 12);
  if (COMPACT) {
    const n = String(level);
    drawText(n, W - 4, H - 9, '#9fe39f', 1, 'right');
    drawSprite(SPR.ufo[0][0], W - 4 - textWidth(n) - 14, H - 11);
  } else {
    drawText('OLEADA ' + level, W - 4, H - 9, '#9fe39f', 1, 'right');
    if (player.triple > 0) {
      drawSprite(SPR.carton, W / 2 - 12, H - 11);
      drawText('X3 ' + Math.ceil(player.triple), W / 2 - 3, H - 9, PAL.c);
    }
  }
}

// Botón de interfaz en el canvas (con ícono opcional)
function uiBtn(label, icon = false) { return { label, icon, x: 0, y: 0, w: textWidth(label) + 12 + (icon ? 7 : 0), h: 13 }; }
function drawUIButton(b, primary) {
  const face = primary ? '#d03a33' : '#16307a', edge = primary ? '#6e1514' : '#06123a';
  roundRect(b.x, b.y + 1.5, b.w, b.h, edge);
  roundRect(b.x, b.y, b.w, b.h, '#050a1f');
  roundRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1, face);
  ctx.fillStyle = primary ? '#ff8f86' : '#4b84ef';
  ctx.fillRect(b.x + 1.5, b.y + 1, b.w - 3, 0.5);
  let tx = b.x + 6;
  if (b.icon) { drawSprite(SPR.download, tx, b.y + 4); tx += 7; }
  drawTextShadow(b.label, tx, b.y + 3, PAL.w, 1, 'left', edge);
}

// Inicio minimalista: logo, indicación para jugar, récord (si existe) y botón de instalar
function titleLayout() {
  const logo = COMPACT ? LOGO_S : LOGO, sub = COMPACT ? SUBLOGO_S : SUBLOGO, gap = COMPACT ? 12 : 26;
  const btn = canInstall() ? uiBtn(COMPACT ? 'INSTALAR' : 'INSTALAR APP', true) : null;
  const recStep = COMPACT ? 12 : 16, btnGap = COMPACT ? 6 : 12;
  const recH = hi > 0 ? recStep : 0;
  const blockH = logo.lh + 4 + sub.lh + gap + 7 + recH + (btn ? btnGap + 13 : 0);
  const L = { logo, sub };
  // en celular el bloque se apoya sobre las pacas para dejar libre la luna
  L.logoY = COMPACT ? SHIELD_Y - 6 - blockH : Math.round((TOP + SHIELD_Y) / 2 - blockH / 2 - 6);
  L.subY = L.logoY + logo.lh + 4;
  L.promptY = L.subY + sub.lh + gap;
  L.recY = L.promptY + recStep;
  if (btn) { btn.x = Math.round(W / 2 - btn.w / 2); btn.y = L.promptY + 7 + recH + btnGap; L.btn = btn; }
  return L;
}
function drawTitle() {
  const L = titleLayout();
  blitLogo(L.logo, Math.round((W - L.logo.lw) / 2), L.logoY);
  blitLogo(L.sub, Math.round((W - L.sub.lw) / 2), L.subY);
  if (!invite && !helpOpen) {
    ctx.globalAlpha = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(clock * 3.2));   // respira en vez de parpadear
    drawTextShadow(touchMode ? 'TOCA PARA JUGAR' : 'PRESIONA ENTER', W / 2, L.promptY, PAL.w, 1, 'center');
    ctx.globalAlpha = 1;
  }
  if (hi > 0) drawText('RECORD ' + pad(hi), W / 2, L.recY, '#4f6299', 1, 'center');
  if (L.btn) drawUIButton(L.btn, false);
}

// Invitación a instalar (celular, después de jugar una partida)
function inviteLayout() {
  const maxW = W - panelM() * 2 - 10;
  const hs = titleS(), head = wrapText('¿TE GUSTO?', hs, maxW);
  const body = wrapText('INSTALALO PARA JUGAR A PANTALLA COMPLETA Y SIN INTERNET', 1, maxW);
  const bI = uiBtn('INSTALAR', true), bL = uiBtn('AHORA NO');
  const stack = bI.w + bL.w + 6 > maxW;
  const textH = head.length * lineH(hs) + 4 + body.length * lineH(1);
  const total = textH + 8 + (stack ? 30 : 13);
  const y0 = Math.round(CY - total / 2), by = y0 + textH + 8;
  if (stack) { bI.x = Math.round(W / 2 - bI.w / 2); bI.y = by; bL.x = Math.round(W / 2 - bL.w / 2); bL.y = by + 17; }
  else { const tw = bI.w + bL.w + 6; bI.x = Math.round(W / 2 - tw / 2); bL.x = bI.x + bI.w + 6; bI.y = bL.y = by; }
  return { y0, total, hs, head, body, bI, bL };
}
function drawInvite() {
  const L = inviteLayout();
  drawPanel(L.y0 - 9, L.y0 + L.total + 9);
  let y = L.y0;
  for (const l of L.head) { drawTextShadow(l, W / 2, y, PAL.y, L.hs, 'center'); y += lineH(L.hs); }
  y += 4;
  for (const l of L.body) { drawTextShadow(l, W / 2, y, PAL.w, 1, 'center'); y += lineH(1); }
  drawUIButton(L.bI, true);
  drawUIButton(L.bL, false);
}
function drawInstallHelp() {
  const steps = IS_IOS
    ? ['1. TOCA COMPARTIR (EL CUADRO CON LA FLECHA HACIA ARRIBA)', "2. ELIGE 'AGREGAR A INICIO'"]
    : ['1. ABRE EL MENU DEL NAVEGADOR (LOS 3 PUNTOS)', "2. ELIGE 'INSTALAR APP' O 'AGREGAR A PANTALLA DE INICIO'"];
  drawPanelItems([['PARA INSTALAR', titleS(), PAL.y], ...steps.map(t => [t, 1, PAL.w]), ['TOCA PARA CERRAR', 1, '#7f95c9']]);
}

const panelM = () => COMPACT ? 4 : 14;
const titleS = () => COMPACT ? 1 : 2;   // títulos de avisos y paneles: en celular, del tamaño normal
function drawPanel(y0, y1) {
  const m = panelM();
  ctx.fillStyle = 'rgba(4,8,24,0.85)';
  ctx.fillRect(m, y0, W - m * 2, y1 - y0);
  ctx.fillStyle = PAL.b;
  ctx.fillRect(m, y0, W - m * 2, 1); ctx.fillRect(m, y1 - 1, W - m * 2, 1);
  ctx.fillRect(m, y0, 1, y1 - y0); ctx.fillRect(W - m - 1, y0, 1, y1 - y0);
  ctx.fillStyle = '#06123a';
  ctx.fillRect(m + 1, y0 + 1, W - m * 2 - 2, 0.5);
}
// Panel centrado que se ajusta a su contenido; cada renglón: [texto, escala, color, visible]
function drawPanelItems(items) {
  const maxW = W - panelM() * 2 - 8;
  const laid = items.map(([t, sc, col, show = true]) => ({ lines: wrapText(t, sc, maxW), sc, col, show }));
  const total = laid.reduce((a, it) => a + it.lines.length * lineH(it.sc) + 4, 0) - 4;
  let y = Math.round(CY - total / 2);
  drawPanel(y - 9, y + total + 7);
  for (const it of laid) {
    if (it.show) it.lines.forEach((l, k) => drawTextShadow(l, W / 2, y + k * lineH(it.sc), it.col, it.sc, 'center'));
    y += it.lines.length * lineH(it.sc) + 4;
  }
}

function drawGameOver() {
  const blinkRec = Math.floor(clock * 4) % 2 === 1, blinkGo = stateTimer > 1 && Math.floor(clock * 2.2) % 2 === 0;
  if (COMPACT) {
    // tarjeta de resultados: oscurece todo y deja solo lo esencial, con los puntos en grande
    ctx.fillStyle = 'rgba(4,8,24,0.6)';
    ctx.fillRect(-OX, 0, VW, H);
    const items = [['FIN DEL JUEGO', titleS(), PAL.r]];
    if (gameOverReason) items.push([gameOverReason.short, 1, PAL.y]);
    items.push(['PUNTOS', 1, '#7fb2ff'], [pad(score), 1.5, PAL.w], ['OLEADA ' + level, 1, '#9fe39f']);
    if (newRecord) items.push(['¡NUEVO RECORD!', 1, PAL.c, blinkRec]);
    items.push(['TOCA PARA SEGUIR', 1, PAL.y, blinkGo]);
    drawPanelItems(items);
    return;
  }
  const items = [['FIN DEL JUEGO', 2, PAL.r]];
  if (gameOverReason) items.push([gameOverReason.text, 1, PAL.y]);
  items.push(['PUNTOS ' + pad(score), 1, PAL.w], ['VAQUITAS A SALVO: ' + cowsLeft(), 1, '#9fe39f']);
  if (newRecord) items.push(['¡NUEVO RECORD! OLEADA ' + level, 1, PAL.c, blinkRec]);
  items.push([touchMode ? 'TOCA PARA CONTINUAR' : 'ENTER PARA CONTINUAR', 1, PAL.y, blinkGo]);
  drawPanelItems(items);
}

function drawLevelClear() {
  drawPanelItems(COMPACT ? [['¡SUPERADA!', titleS(), PAL.y], ['BONO +' + waveBonus, 1, PAL.c]]
    : [['¡OLEADA SUPERADA!', 2, PAL.y], ['BONO LECHERO +' + waveBonus, 1, PAL.c]]);
}

// Avisos de la partida (oleada nueva, sin defensa)
function drawBanner() {
  const raid = state === 'raid', blink = !raid || Math.floor(clock * 3) % 3;
  if (COMPACT) {
    // franja de un renglón: arriba de las pacas, o bajo el marcador durante el ataque final
    const ts = titleS(), h = lineH(ts) + lineH(1) + 6;
    const y0 = raid ? 13 : SHIELD_Y - h - 3;
    ctx.fillStyle = 'rgba(4,8,24,0.75)';
    ctx.fillRect(-OX, y0, VW, h);
    ctx.fillStyle = raid ? PAL.r : PAL.b;
    ctx.fillRect(-OX, y0, VW, 0.5); ctx.fillRect(-OX, y0 + h - 0.5, VW, 0.5);
    if (blink) drawTextShadow(banner.text, W / 2, y0 + 3, raid ? PAL.r : PAL.w, ts, 'center');
    drawTextShadow(banner.sub, W / 2, y0 + 3 + lineH(ts), PAL.y, 1, 'center');
    return;
  }
  const by = banner.y || CY + 4;
  const big = wrapText(banner.text, 2, W - 8), small = wrapText(banner.sub, 1, W - 8);
  const h2 = big.length * lineH(2) + 2;
  if (raid) { ctx.fillStyle = 'rgba(4,8,24,0.7)'; ctx.fillRect(-OX, by - 5, VW, h2 + small.length * lineH(1) + 8); }
  if (blink) big.forEach((l, k) => drawTextShadow(l, W / 2, by + k * lineH(2), raid ? PAL.r : PAL.w, 2, 'center'));
  small.forEach((l, k) => drawTextShadow(l, W / 2, by + h2 + k * lineH(1), PAL.y, 1, 'center'));
}

// ---------- Panel de controles táctiles (dibujado en el canvas) ----------
let deckBtns = [];
function layoutDeck() {
  deckBtns = [];
  if (!DECK_H) return;
  const pad = Math.max(3, Math.round(VW * 0.03)), bh = Math.min(DECK_H - 10, 50), y = H + Math.round((DECK_H - bh) / 2);
  const aw = Math.min(Math.round(bh * 1.1), Math.floor((VW * 0.52 - pad * 3) / 2));
  const fw = Math.min(Math.round(bh * 1.8), Math.round(VW * 0.38));
  const L = { id: 'left', x: pad, y, w: aw, h: bh };
  const R = { id: 'right', x: pad * 2 + aw, y, w: aw, h: bh };
  const F = { id: 'fire', x: VW - pad - fw, y, w: fw, h: bh };
  deckBtns = [L, R, F];
}
function roundRect(x, y, w, h, col, r = 1) {
  ctx.fillStyle = col;
  ctx.fillRect(x + r, y, w - r * 2, h);
  ctx.fillRect(x, y + r, w, h - r * 2);
}
function drawDeck() {
  ctx.fillStyle = '#0a1233';
  ctx.fillRect(0, H, VW, DECK_H);
  ctx.fillStyle = '#0f1b45';
  for (let y = H + 4; y < VH; y += 4) for (let x = ((y - H) / 4 % 2) * 2; x < VW; x += 4) ctx.fillRect(x, y, 0.5, 0.5);
  ctx.fillStyle = PAL.b; ctx.fillRect(0, H, VW, 1);
  ctx.fillStyle = '#06123a'; ctx.fillRect(0, H + 1, VW, 0.5);

  for (const b of deckBtns) {
    const on = b.id === 'pause' ? paused : b.id === 'mute' ? false : held(b.id);
    const fireB = b.id === 'fire', small = b.id === 'pause' || b.id === 'mute';
    const face = fireB ? (on ? '#ff5a4e' : '#d03a33') : (on ? '#1f5fd1' : '#16307a');
    const edge = fireB ? '#6e1514' : '#06123a';
    const light = fireB ? '#ff8f86' : '#4b84ef';
    const depth = small ? 1 : 2, dy = on ? depth : 0, r = small ? 0.5 : 1.5;
    if (!on) roundRect(b.x, b.y + depth, b.w, b.h, edge, r);
    roundRect(b.x, b.y + dy, b.w, b.h, '#050a1f', r);
    roundRect(b.x + 0.5, b.y + dy + 0.5, b.w - 1, b.h - 1, face, r);
    ctx.fillStyle = light;
    ctx.fillRect(b.x + r + 0.5, b.y + dy + 1, b.w - r * 2 - 1, 0.5);
    const cx = b.x + b.w / 2, cy = b.y + dy + b.h / 2;
    if (b.id === 'left' || b.id === 'right') {
      const s = Math.round(b.h * 0.22);
      ctx.fillStyle = PAL.w;
      for (let i = 0; i <= s * 2; i++) {
        const hh = i * 0.5 * 0.85, xx = b.id === 'left' ? cx - s / 2 + i * 0.5 : cx + s / 2 - i * 0.5;
        ctx.fillRect(snap(xx), snap(cy - hh), 0.5, Math.max(0.5, snap(hh * 2)));
      }
    } else if (b.id === 'fire') {
      drawTextShadow('FUEGO', cx, Math.round(cy - 3.5), PAL.w, 1, 'center', '#6e1514');
    } else if (b.id === 'pause') drawIconPause(cx, cy, 2.5);
    else drawIconSound(cx, cy);
  }
}

function render() {
  ctx.setTransform(Sint, 0, 0, Sint, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(bgSky, 0, 0, VW, H);
  drawStars();
  drawClouds();
  ctx.save();
  if (shake > 0) ctx.translate(snap((Math.random() * 2 - 1) * shake), snap((Math.random() * 2 - 1) * shake));
  ctx.drawImage(bgFront, 0, 0, VW, H);
  drawWindmill();
  ctx.translate(OX, 0);
  if (state === 'title') {
    drawShields();
    for (const c of cows) drawCow(c);
    drawSprite(SPR.truck, player.x, player.y);
  } else {
    drawWorld();
  }
  drawParticles();
  ctx.restore();

  ctx.save();
  ctx.translate(OX, 0);
  drawFloaters();
  drawHUD();
  if (state === 'title') drawTitle();
  if (banner && !paused && (state === 'playing' || state === 'raid')) drawBanner();
  if (state === 'levelclear') drawLevelClear();
  if (state === 'gameover') drawGameOver();
  if (paused) drawPanelItems([['PAUSA', titleS(), PAL.w], [touchMode ? 'TOCA LA PANTALLA' : 'P PARA CONTINUAR', 1, '#9ccaff']]);
  if (invite) drawInvite();
  if (helpOpen) drawInstallHelp();
  ctx.restore();
  if (DECK_H) drawDeck();
}

// ======================================================================
//  Entrada (teclado + táctil / ratón sobre el canvas)
// ======================================================================
const kb = { left: false, right: false, fire: false };   // teclado
const tk = { left: false, right: false, fire: false };   // táctil
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'fire', ArrowUp: 'fire', KeyW: 'fire' };

addEventListener('keydown', e => {
  AudioSys.init();
  const k = KEYMAP[e.code];
  if (k) { kb[k] = true; e.preventDefault(); }
  if (e.repeat) return;
  if (helpOpen) { helpOpen = false; return; }
  if (invite) {
    if (e.code === 'Enter') doInstall();
    else if (e.code === 'Escape') laterInstall();
    return;
  }
  if (e.code === 'Enter' || e.code === 'Space') requestStart();
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'KeyM') toggleMute();
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) kb[k] = false; });
addEventListener('blur', () => { kb.left = kb.right = kb.fire = false; ptrs.clear(); syncTouch(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && (state === 'playing' || state === 'dying')) paused = true;
});

function toggleMute() { AudioSys.setMuted(!AudioSys.muted); }

const inside = (b, x, y, m = 0) => x >= b.x - m && x < b.x + b.w + m && y >= b.y - m && y < b.y + b.h + m;
function zoneAt(vx, vy) {
  const px = vx - OX;
  if (helpOpen) return 'closehelp';
  if (invite) {
    const L = inviteLayout();
    if (inside(L.bI, px, vy, 2)) return 'install';
    if (inside(L.bL, px, vy, 2)) return 'later';
    return 'modal';
  }
  if (state === 'title') { const T = titleLayout(); if (T.btn && inside(T.btn, px, vy, 3)) return 'install'; }
  if (DECK_H && vy >= H) {
    const [L, R, F] = deckBtns;
    if (vx >= F.x - 4) return 'fire';
    if (vx < (L.x + L.w + R.x) / 2) return 'left';
    if (vx < R.x + R.w + 4) return 'right';
    return null;
  }
  for (const b of topBtns()) {
    if (state === 'title' && b.id === 'pause') continue;
    if (inside(b, vx - OX, vy, touchMode ? 4 : 3)) return b.id;
  }
  return 'screen';
}
const ptrs = new Map();
function syncTouch() {
  tk.left = tk.right = tk.fire = false;
  for (const z of ptrs.values()) if (z in tk) tk[z] = true;
}
function toView(e) {
  const r = cvs.getBoundingClientRect();
  return [(e.clientX - r.left) * VW / r.width, (e.clientY - r.top) * VH / r.height];
}
cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  AudioSys.init();
  if (e.pointerType === 'touch' && !touchMode) { touchMode = true; fit(); }
  const [x, y] = toView(e);
  const z = zoneAt(x, y);
  try { cvs.setPointerCapture(e.pointerId); } catch {}
  ptrs.set(e.pointerId, z);
  if (z === 'pause') togglePause();
  else if (z === 'mute') toggleMute();
  else if (z === 'later') laterInstall();
  else if (z === 'closehelp') helpOpen = false;
  else if (z === 'fire' || z === 'screen') { if (paused) paused = false; else requestStart(); }
  syncTouch();
});
cvs.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId);
  if (prev !== 'left' && prev !== 'right' && prev !== 'fire') return;
  const z = zoneAt(...toView(e));     // permite deslizar el pulgar entre botones
  if (z === 'left' || z === 'right' || z === 'fire') { ptrs.set(e.pointerId, z); syncTouch(); }
});
const release = e => {
  if (e.type === 'pointerup' && ptrs.get(e.pointerId) === 'install' && zoneAt(...toView(e)) === 'install') doInstall();
  ptrs.delete(e.pointerId);
  syncTouch();
};
cvs.addEventListener('pointerup', release);
cvs.addEventListener('pointercancel', release);
cvs.addEventListener('lostpointercapture', release);
cvs.addEventListener('contextmenu', e => e.preventDefault());

// ======================================================================
//  Escalado: llena toda la pantalla
// ======================================================================
// El mundo lógico se adapta a la forma de la pantalla. Se dibuja a un múltiplo
// entero de la resolución de sprite (píxeles uniformes) y el navegador lo ajusta
// al tamaño exacto de la pantalla.
let layoutKey = '', deckDev = 0, fitS = 1;
function fit() {
  const r = wrap.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const dw = Math.max(1, r.width * dpr), dh = Math.max(1, r.height * dpr);
  // En celular vertical el mundo es más angosto (~3.3 px de pantalla por unidad) para que
  // todo se vea al doble; el panel de controles mide lo mismo en cualquier teléfono.
  const portrait = touchMode && r.height > r.width * 1.2;
  const minW = portrait ? clamp(r.width / 3.3, 112, 224) : 224;
  const minH = portrait ? 190 : 256;
  deckDev = touchMode ? clamp(r.height * (portrait ? 0.16 : 0.2), 90, 150) * dpr : 0;
  const S = Math.min(dw / minW, (dh - deckDev) / minH);
  const vw = Math.floor(dw / S), vh = Math.floor(dh / S);
  let si = RS * Math.max(1, Math.ceil(S / RS - 0.15));
  while (si > RS && vw * vh * si * si > 5.5e6) si -= RS;
  Sint = si;
  cvs.width = vw * si; cvs.height = vh * si;
  cvs.style.width = (vw * S / dpr) + 'px';
  cvs.style.height = (vh * S / dpr) + 'px';
  fitS = S;
  const key = vw + 'x' + vh + 'x' + touchMode;
  if (key !== layoutKey) { layoutKey = key; applyLayout(vw, vh); }
}
function applyLayout(vw, vh) {
  const deck = touchMode ? Math.round(deckDev / fitS) : 0;
  const wasCompact = COMPACT;
  setLayout(vw, vh, deck);
  layoutDeck();
  buildScene();
  // reacomoda lo que ya está en pantalla
  if (shields.length !== nShields()) shields = makeShields();
  shields.forEach((s, i) => { s.x = shieldX(i, shields.length); s.y = SHIELD_Y; });
  player.y = PLAYER_Y;
  player.x = clamp(player.x, 2, W - TRUCK_W - 2);
  for (const c of cows) { c.x = clamp(c.x, 4, W - 16); if (c.state === 'free') c.y = COW_Y; }
  form.x = clamp(form.x, 3, Math.max(3, W - COLS * COLG));
  if (state === 'title') { player.x = W / 2 - TRUCK_W / 2; cows = makeCows(); }
  else if (wasCompact !== COMPACT && state !== 'gameover') startWave();   // cambió la forma de pantalla: rearma la oleada
}
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 150));
fit();

// ======================================================================
//  Bucle principal (timestep fijo)
// ======================================================================
const STEP = 1 / 60;
let last = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;
  acc += dt;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  Music.want(musicFor());
  Music.tick();
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Gancho de depuración (útil para pruebas)
window.__vaquitas = {
  get state() { return state; }, get score() { return score; }, get level() { return level; },
  get lives() { return lives; }, get cows() { return cowsLeft(); }, get alive() { return aliveCount(); },
  get abductors() { return abductors.length; }, get diff() { return DF; },
  get divers() { return inv.filter(i => i.alive && i.dive).length; },
  get layout() { return { VW, VH, W, H, OX, DECK_H, Sint, VD, canvas: [cvs.width, cvs.height] }; },
  start: () => newGame(), abduct: () => startAbduction(), dive: () => startDive(),
  gotoWave: n => { level = n - 1; inv.forEach(i => (i.alive = false)); },
  lastLife: () => { lives = 1; hitPlayer(); },
  clearWave: () => { inv.forEach(i => (i.alive = false)); },
  get internals() { return { player, abductors, cows, eshots, shots }; },
  sprites: SPR,
  get music() { return Music.track; },
  get install() { return { installed, prompt: !!deferredPrompt, invite, helpOpen, can: canInstall(), games: gamesPlayed() }; },
  openInvite: () => { invite = true; }, openHelp: () => { helpOpen = true; }, pause: () => togglePause(),
  zone: (vx, vy) => zoneAt(vx, vy), titleBtn: () => titleLayout().btn,
  audioTest: () => {            // programa cada nota de cada pista para detectar errores
    AudioSys.init();
    if (!Music.out) { Music.out = AudioSys.ac.createGain(); Music.out.connect(AudioSys.master); }
    let n = 0;
    for (const tr of Object.values(Music.tracks)) for (const evs of tr.ev) for (const e of evs) { Music.voice(e, AudioSys.ac.currentTime + 5, 0.1); n++; }
    return n;
  },
  get keys() { return { kb: { ...kb }, tk: { ...tk }, ptrs: [...ptrs.values()] }; },
  get mother() { return mother && { x: mother.x, dir: mother.dir }; },
  get powerups() { return powerups.map(p => ({ state: p.state, y: Math.round(p.y), life: +p.life.toFixed(2) })); },
  spawnMother: () => { motherT = 0; }, hitMother: () => { if (mother) killMother(); },
  step: sec => { for (let k = 0; k < sec * 60; k++) { update(STEP); Music.want(musicFor()); } render(); },
  renderTrack: async (name, secs) => {   // mide nivel pico/RMS de una pista sin reproducirla
    const save = { ac: AudioSys.ac, master: AudioSys.master, buf: AudioSys.noiseBuf, out: Music.out };
    const oc = new OfflineAudioContext(1, Math.round(44100 * secs), 44100);
    AudioSys.ac = oc; AudioSys.master = oc.createGain(); AudioSys.master.gain.value = 0.35; AudioSys.master.connect(oc.destination);
    AudioSys.noiseBuf = oc.createBuffer(1, 44100, 44100); const d = AudioSys.noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    Music.out = oc.createGain(); Music.out.gain.value = 0.45; Music.out.connect(AudioSys.master);
    const tr = Music.tracks[name], sd = 60 / tr.bpm / 4;
    for (let t = 0, s = 0; t < secs - 0.4; t += sd, s = (s + 1) % tr.ev.length) { if (!tr.loop && t >= tr.ev.length * sd) break; for (const e of tr.ev[s]) Music.voice(e, t, sd); }
    const buf = await oc.startRendering(), x = buf.getChannelData(0);
    Object.assign(AudioSys, { ac: save.ac, master: save.master, noiseBuf: save.buf }); Music.out = save.out;
    let pk = 0, sq = 0; for (const v of x) { pk = Math.max(pk, Math.abs(v)); sq += v * v; }
    return { peak: +pk.toFixed(3), rms: +Math.sqrt(sq / x.length).toFixed(4) };
  },
  leave: n => { let k = 0; for (const i of inv) if (i.alive && ++k > n) i.alive = false; }
};

// Instalable / offline (PWA). Requiere https o localhost.
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
